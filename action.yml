name: "xsec: OWASP Top 10 scan and code review"
description: "Scan each pull request's preview deployment for the OWASP Top 10, review the code it adds for security mistakes, check its dependencies against recent advisories, comment in plain words, and fail on new findings."
author: "xtruct"
branding:
  icon: shield
  color: purple

inputs:
  url:
    description: "The preview deployment to scan (e.g. github.event.deployment_status.target_url). Empty: no scan, only the code review."
    required: false
    default: ""
  review:
    description: "auto | true | false: review the code the pull request adds. auto runs on pull_request events when the checkout has the base commit (actions/checkout with fetch-depth: 0)."
    required: false
    default: "auto"
  review-fail-on:
    description: "never | low | medium | high | critical: fail the check on a code review finding at or above this severity (guesses and AI findings never fail it)."
    required: false
    default: "high"
  review-base:
    description: "The commit or branch to compare with (default: the pull request's base commit; outside a pull_request event, the merge base with origin/main)."
    required: false
    default: ""
  deps:
    description: "auto | true | false: check the checkout's lockfiles (npm, pnpm, yarn, bun, pip, poetry, uv, bundler, composer, go) against xsec's list of recent, serious advisories, offline. auto runs on pull_request events when the checkout has a lockfile."
    required: false
    default: "auto"
  deps-fail-on:
    description: "never | low | medium | high | critical: fail the check when an installed dependency is named by an advisory at or above this severity. Critical by default: such a problem is usually older than the pull request."
    required: false
    default: "critical"
  base-url:
    description: "Production (or main's deployment), scanned with the same options as the baseline: only findings the preview adds are new. Empty: every finding counts."
    required: false
    default: ""
  fail-on:
    description: "never | low | medium | high | critical: fail the check on new findings at or above this severity."
    required: false
    default: "high"
  passive:
    description: "true: only what a visitor's browser sees (no payloads, no guessed paths). Set false for a full scan only on environments you own."
    required: false
    default: "true"
  headers:
    description: "Extra request headers, one 'Name: value' per line, sent only to the scanned origins (e.g. x-vercel-protection-bypass). Pass values from secrets; they are masked and never stored in the report."
    required: false
    default: ""
  seeds:
    description: "Extra entry points (paths or URLs on the same host), one per line, for pages a crawl cannot reach by links."
    required: false
    default: ""
  comment:
    description: "true: keep one sticky comment on the pull request with the results, and post the code review's inline comments (needs pull-requests: write)."
    required: false
    default: "true"
  github-token:
    description: "Token for the PR comment."
    required: false
    default: ${{ github.token }}
  xsec-token:
    description: "A CI token for this site from the xsec dashboard (xsec_ci_...). Given: the report is uploaded to the dashboard, and the code review adds an AI review (the PR's changed lines, secrets redacted, go to xsec and OpenAI)."
    required: false
    default: ""
  xsec-api:
    description: "The xsec API the report is uploaded to."
    required: false
    default: "https://xsec-api.91.107.213.88.sslip.io"
  version:
    description: "xsec CLI version to download (e.g. 0.2.0), or latest."
    required: false
    default: "latest"
  args:
    description: "Advanced: extra xsec CLI flags, separated by spaces (e.g. --max-pages 50)."
    required: false
    default: ""

outputs:
  exit-code:
    description: "The action's exit code: 0 ok, 2 new scan findings at or above fail-on, code review findings at or above review-fail-on or dependency problems at or above deps-fail-on, 1 could not run."
    value: ${{ steps.scan.outputs.exit-code }}
  review-exit-code:
    description: "The code review's own exit code (0, 2 or 1), when it ran."
    value: ${{ steps.scan.outputs.review-exit-code }}
  review-findings:
    description: "How many problems the code review found, when it ran."
    value: ${{ steps.scan.outputs.review-findings }}
  review-markdown:
    description: "Path to the code review in Markdown."
    value: ${{ steps.scan.outputs.review-markdown }}
  review-json:
    description: "Path to the code review in JSON."
    value: ${{ steps.scan.outputs.review-json }}
  deps-exit-code:
    description: "The dependency check's own exit code (0, 2 or 1), when it ran."
    value: ${{ steps.scan.outputs.deps-exit-code }}
  deps-findings:
    description: "How many installed dependencies an advisory names, when the check ran."
    value: ${{ steps.scan.outputs.deps-findings }}
  deps-markdown:
    description: "Path to the dependency check in Markdown."
    value: ${{ steps.scan.outputs.deps-markdown }}
  deps-json:
    description: "Path to the dependency check in JSON."
    value: ${{ steps.scan.outputs.deps-json }}
  new-findings:
    description: "How many findings are new compared with base-url (all findings without one)."
    value: ${{ steps.scan.outputs.new-findings }}
  report-json:
    description: "Path to the JSON report."
    value: ${{ steps.scan.outputs.report-json }}
  report-markdown:
    description: "Path to the Markdown report."
    value: ${{ steps.scan.outputs.report-markdown }}
  diff-json:
    description: "Path to the comparison with base-url (new, still open, fixed), when there is one."
    value: ${{ steps.scan.outputs.diff-json }}
  dashboard-url:
    description: "The scan in the xsec dashboard, when uploaded."
    value: ${{ steps.scan.outputs.dashboard-url }}

runs:
  using: composite
  steps:
    - id: scan
      shell: bash
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_BASE_URL: ${{ inputs.base-url }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_REVIEW: ${{ inputs.review }}
        INPUT_REVIEW_FAIL_ON: ${{ inputs.review-fail-on }}
        INPUT_REVIEW_BASE: ${{ inputs.review-base }}
        INPUT_DEPS: ${{ inputs.deps }}
        INPUT_DEPS_FAIL_ON: ${{ inputs.deps-fail-on }}
        INPUT_PASSIVE: ${{ inputs.passive }}
        INPUT_HEADERS: ${{ inputs.headers }}
        INPUT_SEEDS: ${{ inputs.seeds }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_XSEC_TOKEN: ${{ inputs.xsec-token }}
        INPUT_XSEC_API: ${{ inputs.xsec-api }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_ARGS: ${{ inputs.args }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: '"$GITHUB_ACTION_PATH/run.sh"'
